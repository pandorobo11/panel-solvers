site_name: panel-solvers Documentation
site_description: Offline documentation for the panel-solvers distribution.
docs_dir: docs
use_directory_urls: false
theme:
  name: readthedocs
  highlightjs: false
plugins: []
markdown_extensions:
  - tables
nav:
