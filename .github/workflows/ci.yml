name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel

      - name: Verify Embree backend availability
        run: >-
          uv run python -c "import trimesh; from trimesh import ray;
          print('trimesh_version:', trimesh.__version__);
          print('has_embree:', ray.has_embree);
          (_ for _ in ()).throw(SystemExit('Embree backend is required in CI but not available.'))
          if not ray.has_embree else None"

      - name: Unit tests
        timeout-minutes: 10
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: Scheduler lifecycle stress
        timeout-minutes: 3
        run: >-
          uv run python scripts/probe_scheduler_lifecycle.py
          --iterations 10 --timeout-seconds 90

      - name: Static checks
        run: uv run ruff check src tests scripts

      - name: Build and reinstall wheel
        run: |
          uv build
          uv run --no-sync python scripts/release_tools.py reinstall-wheel .

      - name: Smoke installed commands outside repository
        run: uv run --no-sync python scripts/smoke_installed_wheel.py .

      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          uv run --no-sync python scripts/release_tools.py verify-tag . "$TAG"

  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel

      - name: Build distributions
        run: uv build

      - name: Dry-run a hypothetical release version
        run: >-
          uv run --no-sync python scripts/release_tools.py dry-run .

      - name: Reinstall built wheel
        run: >-
          uv run --no-sync python scripts/release_tools.py reinstall-wheel .

      - name: Smoke test installed wheel
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" - <<'PY'
          import importlib.metadata

          import fmfsolver
          import newtsolver
          import panelsolver
          from fmfsolver.app.gui_app import main as fmf_gui_main
          from fmfsolver.gui_spec import solver_spec as fmf_solver_spec
          from newtsolver.app.gui_app import main as newt_gui_main
          from newtsolver.gui_spec import solver_spec as newt_solver_spec
          from panelsolver.app.gui_bootstrap import prepare_gui_spec

          assert callable(fmf_gui_main)
          assert callable(newt_gui_main)
          assert prepare_gui_spec(fmf_solver_spec()).model_id == "sentman"
          assert prepare_gui_spec(newt_solver_spec()).model_id == "hypersonic"
          legacy = {
              "fmfsolver": "fmfsolver.app.gui_app:main",
              "fmfsolver-gui": "fmfsolver.app.gui_app:main",
              "fmfsolver-cli": "fmfsolver.app.cli_app:main",
              "newtsolver": "newtsolver.app.gui_app:main",
              "newtsolver-gui": "newtsolver.app.gui_app:main",
              "newtsolver-cli": "newtsolver.app.cli_app:main",
          }
          scripts = {
              entry.name: entry.value
              for entry in importlib.metadata.distribution("panel-solvers").entry_points
              if entry.group == "console_scripts"
          }
          assert legacy == scripts
          PY

      - name: Smoke installed commands outside repository
        run: uv run --no-sync python scripts/smoke_installed_wheel.py .

  release:
    needs: [test, artifact]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Build distribution
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          python scripts/release_tools.py verify-tag . "$TAG"
          python scripts/release_tools.py release-notes . --output release-notes.md
          uv build
          python scripts/release_tools.py verify-wheel .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
