name: CI

on:
  push:
  pull_request:

jobs:
  test:
    needs: artifact
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: panel-solvers-dist-${{ github.run_id }}
          path: dist

      - name: Verify downloaded distribution manifest
        run: >-
          uv run --no-sync python scripts/release_tools.py verify-manifest .
          --manifest dist/manifest.json --dist-dir dist
          --expected-commit "${{ github.sha }}"

      - name: Verify Embree backend availability
        run: >-
          uv run python -c "import trimesh; from trimesh import ray;
          print('trimesh_version:', trimesh.__version__);
          print('has_embree:', ray.has_embree);
          (_ for _ in ()).throw(SystemExit('Embree backend is required in CI but not available.'))
          if not ray.has_embree else None"

      - name: Unit tests
        timeout-minutes: 10
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: Scheduler lifecycle stress
        timeout-minutes: 3
        run: >-
          uv run python scripts/probe_scheduler_lifecycle.py
          --iterations 10 --timeout-seconds 90

      - name: Static checks
        run: uv run ruff check src tests scripts

      - name: Reinstall exact verified wheel
        run: >-
          uv run --no-sync python scripts/release_tools.py reinstall-wheel .
          --dist-dir dist

      - name: Smoke installed commands outside repository
        run: uv run --no-sync python scripts/smoke_installed_wheel.py .

  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Install Linux GUI runtime
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install dependencies
        run: uv sync --locked --extra rayaccel

      - name: Build distributions
        run: uv build

      - name: Create and verify distribution manifest
        run: >-
          uv run --no-sync python scripts/release_tools.py create-manifest .
          --commit-sha "${{ github.sha }}" --output dist/manifest.json
          --dist-dir dist

      - name: Verify release tag against protected main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch origin main --tags --force
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_COMMIT="$(git rev-parse refs/remotes/origin/main^{commit})"
          uv run --no-sync python scripts/release_tools.py verify-tag . "$TAG" \
            --expected-commit "$EXPECTED_COMMIT"

      - name: Dry-run a hypothetical release version
        run: >-
          uv run --no-sync python scripts/release_tools.py dry-run .

      - name: Probe exact pinned legacy rollback and return
        timeout-minutes: 15
        shell: bash
        run: |
          PANEL_WHEEL="$(uv run --no-sync python scripts/release_tools.py verify-wheel .)"
          uv run --no-sync python scripts/probe_legacy_rollback.py . \
            --artifact-dir "${RUNNER_TEMP}/rollback-artifacts" \
            --panel-wheel "$PANEL_WHEEL"

      - name: Reinstall built wheel
        run: >-
          uv run --no-sync python scripts/release_tools.py reinstall-wheel .

      - name: Smoke test installed wheel
        run: |
          cd "${RUNNER_TEMP}"
          "${GITHUB_WORKSPACE}/.venv/bin/python" - <<'PY'
          import importlib.metadata

          import fmfsolver
          import newtsolver
          import panelsolver
          from fmfsolver.app.gui_app import main as fmf_gui_main
          from fmfsolver.gui_spec import solver_spec as fmf_solver_spec
          from newtsolver.app.gui_app import main as newt_gui_main
          from newtsolver.gui_spec import solver_spec as newt_solver_spec
          from panelsolver.app.gui_bootstrap import prepare_gui_spec

          assert callable(fmf_gui_main)
          assert callable(newt_gui_main)
          assert prepare_gui_spec(fmf_solver_spec()).model_id == "sentman"
          assert prepare_gui_spec(newt_solver_spec()).model_id == "hypersonic"
          legacy = {
              "fmfsolver": "fmfsolver.app.gui_app:main",
              "fmfsolver-gui": "fmfsolver.app.gui_app:main",
              "fmfsolver-cli": "fmfsolver.app.cli_app:main",
              "newtsolver": "newtsolver.app.gui_app:main",
              "newtsolver-gui": "newtsolver.app.gui_app:main",
              "newtsolver-cli": "newtsolver.app.cli_app:main",
          }
          scripts = {
              entry.name: entry.value
              for entry in importlib.metadata.distribution("panel-solvers").entry_points
              if entry.group == "console_scripts"
          }
          assert legacy == scripts
          PY

      - name: Smoke installed commands outside repository
        run: uv run --no-sync python scripts/smoke_installed_wheel.py .

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: panel-solvers-dist-${{ github.run_id }}
          path: dist
          if-no-files-found: error

  release:
    needs: [test, artifact]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: panel-solvers-dist-${{ github.run_id }}
          path: dist

      - name: Validate release target and distributions
        shell: bash
        run: |
          git fetch origin main --tags --force
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_COMMIT="$(git rev-parse refs/remotes/origin/main^{commit})"
          python scripts/release_tools.py verify-tag . "$TAG" \
            --expected-commit "$EXPECTED_COMMIT"
          python scripts/release_tools.py verify-manifest . \
            --manifest dist/manifest.json --dist-dir dist \
            --expected-commit "${{ github.sha }}"
          python scripts/release_tools.py release-notes . --output release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/manifest.json
