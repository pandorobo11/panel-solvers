[project]
name = "panelsolver"
version = "0.1.0"
description = "Shared panel-solver platform for free-molecular and hypersonic flow models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "pandorobo11" },
]
maintainers = [
  { name = "pandorobo11" },
]
dependencies = [
  "networkx",
  "numpy",
  "openpyxl",
  "pandas",
  "pyside6==6.9.3",
  "pyvista",
  "pyvistaqt",
  "rtree",
  "scipy",
  "trimesh",
]

[project.urls]
Homepage = "https://github.com/pandorobo11/panelsolver"
Repository = "https://github.com/pandorobo11/panelsolver"
Issues = "https://github.com/pandorobo11/panelsolver/issues"

[project.optional-dependencies]
rayaccel = [
  "embreex4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "embreex; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.scripts]
panelsolver = "panelsolver.cli:main"
panelsolver-gui = "panelsolver.gui:main"
fmfsolver = "fmfsolver.app.gui_app:main"
fmfsolver-gui = "fmfsolver.app.gui_app:main"
fmfsolver-cli = "fmfsolver.app.cli_app:main"
newtsolver = "newtsolver.app.gui_app:main"
newtsolver-gui = "newtsolver.app.gui_app:main"
newtsolver-cli = "newtsolver.app.cli_app:main"

[dependency-groups]
dev = ["ruff"]
docs = ["matplotlib"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panelsolver", "src/fmfsolver", "src/newtsolver"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Broad catches remain acceptable only at GUI, worker-process, and optional-
# backend boundaries. These exceptions match the stricter legacy baseline.
ignore = ["BLE001", "EXE001", "S110", "SIM113", "SIM117"]
